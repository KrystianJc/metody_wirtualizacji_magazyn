@if (loading()) {
  <app-loading-page />
} @else {
  <section class="container py-4 vh-100" id="main">
    <h1 class="h3">Produkty w magazynie</h1>
    <select
      class="form-select mb-3"
      aria-label="Filtruj po kategorii"
      [value]="selectedCategoryMain()"
      (change)="onMainCategoryChange($event)"
    >
      <option value="">Wszystkie kategorie</option>
      @for (category of categories(); track category) {
        <option [value]="category">{{ category }}</option>
      }
    </select>
    <div class="row mb-4 g-2 overflow-auto align-content-start" style="height: 75%">
      @for (item of filteredMainProducts(); track item.id) {
        <div class="col-sm-4 d-flex">
          <div class="card flex-fill">
            <div class="card-body d-flex flex-column">
            <h5 class="card-title">{{ item.name }}</h5>         
            <div class="row g-2 mb-3">
              <div class="col-6">
                <div class="text-muted small">Ilość</div>
                <div>{{ item.amount }}</div>
              </div>
              <div class="col-6">
                <div class="text-muted small">Kategoria</div>
                <div>{{ item.category }}</div>
              </div>
            </div>
            <div class="mb-3">
              <div class="text-muted small">Lokalizacja</div>
              <div>
                Sekcja {{ item.section }} · Regał {{ item.rack }}<br />
                Półka {{ item.shelf }} · Miejsce {{ item.placement }}
              </div>
            </div>
            <div class="mt-auto">
              <label class="form-label" for="pickup-{{ item.id }}">
                Ilość do pobrania
              </label>
              <input
                #pickupAmount
                [id]="'pickup-' + item.id"
                class="form-control w-25 mb-2"
                type="number"
                min="1"
                [max]="item.amount"
                value="1"
              />
              <button
                type="button"
                class="btn btn-primary w-25"
                [disabled]="item.amount < 1"
                (click)="onPickup(item.id, pickupAmount.value, item.amount)"
              >
                Pobierz
              </button>
            </div>
          </div>
          </div>
        </div>
      }
    </div>
  </section>
}
