<section class="container py-4" id="add">
    <h1 class="h4 mb-3">Dodaj produkt</h1>
    <div class="row">
      <div class="col-md-6">
        <form>
          <input class="form-check-input me-2" type="checkbox" id="isInMagazine" [checked]="isInMagazine()" (change)="onIsInMagazineChange($event)">
          <label class="form-check-label" for="isInMagazine">Czy produkt jest już w magazynie?</label><br>
          @if (isInMagazine()) {
                <label for="name_f0">Wybierz produkt z magazynu</label>
                <select class="form-control" id="name_f0">
                  @for (item of backendData(); track item.id) {
                    <option>{{ item.name }}</option>
                  }
                </select>
                <label for="amount_f0">Ilość</label>
                <input class="form-control" id="amount_f0" type="number" min="1">
                <fieldset disabled> <!-- Dodaj automatyczne wpisywanie danych wybranego produktu-->
                  <label for="category_f0">Kategoria</label>
                  <input class="form-control" id="category_f0" type="text">
                  <label for="section_f0">Sekcja</label>
                  <input class="form-control" id="section_f0" type="number">
                  <label for="rack_f0">Regał</label>
                  <input class="form-control" id="rack_f0" type="number">
                  <label for="shelf_f0">Półka</label>
                  <input class="form-control" id="shelf_f0" type="number">
                  <label for="placement_f0">Miejsce</label>
                  <input class="form-control" id="placement_f0" type="number">
                </fieldset>

          } @else {
                <label for="name_f1">Nazwa nowego produktu</label>
                <input class="form-control" id="name_f1" type="text">
                <label for="amount_f1">Ilość</label>
                <input class="form-control" id="amount_f1" type="number" >
                <fieldset>
                  <label for="category_f1">Kategoria</label>
                  <input class="form-control" id="category_f1" type="text">
                  <label for="section_f1">Sekcja</label>
                  <input class="form-control" id="section_f1" type="number">
                  <label for="rack_f1">Regał</label>
                  <input class="form-control" id="rack_f1" type="number">
                  <label for="shelf_f1">Półka</label>
                  <input class="form-control" id="shelf_f1" type="number">
                  <label for="placement_f1">Miejsce</label>
                  <input class="form-control" id="placement_f1" type="number">
                </fieldset>
          }
        </form>
        <div class="mt-3">
          <button class="btn btn-primary">Dodaj produkt</button>
        </div>
      </div>
      <div class="col-md-4">
        <ul class="list-group overflow-auto border border-dark" style="height: 50%;">
          <!--Do dorobienia wyświetlanie produktów do zatwierdzenia z opcją zmniejszenia ilości -->
            <li class="list-group-item">Hog rider</li>
        </ul>
        <div class="mt-3">
          <button class="btn btn-primary">Zatwierdź</button>
        </div>
      </div>
    </div>
  </section>
