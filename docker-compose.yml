name: magazyn

services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD:-magazyn_dev}
      POSTGRES_DB: ${DB_NAME:-magazyn}
    volumes:
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql # volume z danymi dla początkowej inicjalizacji danych
      - db_data:/var/lib/postgresql # volume Dockera
    networks:
      - magazyn
    healthcheck:
      test: ['CMD', 'pg_isready', '-h', 'localhost', '-U', 'postgres']
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    ports:
      - '3000:3000'
    networks:
      - magazyn
    environment:
      PORT: 3000
      DB_HOST: db
      DB_USER: postgres
      DB_PASSWORD: ${DB_PASSWORD:-magazyn_dev}
      DB_NAME: ${DB_NAME:-magazyn}
    depends_on:
      db:
        condition: service_healthy
    # AI-assisted: healthcheck generated by Claude (Anthropic), 2026-10-24.
    # Purpose: mark backend as healthy only when GET /health responds.
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:3000/health']
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  frontend:
    build: ./frontend
    ports:
      - '8080:80'
    networks:
      - magazyn
    depends_on:
      backend:
        condition: service_healthy

  # AI-assisted: Prometheus service by Claude (Anthropic), 2026-11-18.
  prometheus:
    image: prom/prometheus:v3.13.5
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - '9090:9090' # panel
    networks:
      - magazyn

  grafana:
    image: grafana/grafana:13.3.1
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-magazyn_dev}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/etc/grafana/dashboards:ro
    ports:
      - '3001:3000'
    networks:
      - magazyn

volumes:
  db_data:
  prometheus_data:
  grafana_data:

networks:
  magazyn:
    driver: bridge
