name: magazyn

services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql # volume z danymi dla początkowej inicjalizacji danych
      - db_data:/var/lib/postgresql # volume Dockera

  backend:
    build: ./backend
    ports:
      - '3000:3000'
    environment:
      PORT: 3000
      DB_HOST: db
      DB_USER: postgres
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
    depends_on: #czekanie na bazę
      - db
    # AI-assisted: healthcheck generated by Claude (Anthropic), 2026-10-24.
    # Purpose: mark backend as healthy only when GET /health responds.
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:3000/health']
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  frontend:
    build: ./frontend
    ports:
      - '8080:80'
    depends_on:
      backend:
        condition: service_healthy

  # AI-assisted: Prometheus service by Claude (Anthropic), 2026-11-18.
  prometheus:
    image: prom/prometheus:v3.13.5
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - '9090:9090' # panel

  grafana:
    image: grafana/grafana:13.3.1
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD}
    volumes:
      - grafana_data:/var/lib/grafana
    ports:
      - '3001:3000'

volumes:
  db_data:
  prometheus_data:
  grafana_data:
